services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capacidad}
      POSTGRES_USER: ${POSTGRES_USER:-capacidad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-capacidad}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-capacidad}
      SECRET_KEY: ${SECRET_KEY:?Definir SECRET_KEY}
      MFA_OBLIGATORIO: ${MFA_OBLIGATORIO:-true}
      MFA_EMISOR: ${MFA_EMISOR:-Servigpoder}
      SESION_INACTIVIDAD_MIN: ${SESION_INACTIVIDAD_MIN:-30}
      SESION_MAX_HORAS: ${SESION_MAX_HORAS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300}
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_BLOQUEO_MINUTOS: ${LOGIN_BLOQUEO_MINUTOS:-15}
      IA_API_KEY: ${IA_API_KEY:-}
      IA_BASE_URL: ${IA_BASE_URL:-https://openrouter.ai/api/v1}
      IA_MODELO: ${IA_MODELO:-anthropic/claude-opus-5}
      IA_ZDR: ${IA_ZDR:-true}
      ASISTENTE_DATOS_PERSONALES: ${ASISTENTE_DATOS_PERSONALES:-true}
      ASISTENTE_MAX_DIARIO: ${ASISTENTE_MAX_DIARIO:-100}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definir ADMIN_PASSWORD}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
